[platformio]
default_envs = xiao_esp32s3

[env]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=1
lib_deps =
  h2zero/NimBLE-Arduino@^1.4.2
  bblanchon/ArduinoJson@^7.2.0
  mikalhart/TinyGPSPlus@^1.1.0

; Target 1: Bare Seeed Studio XIAO ESP32-S3
; Monitors BLE 5.0 + 2.4 GHz Wi-Fi Probes/Deauths (+ optional UART GPS on GPIO43/44)
[env:xiao_esp32s3]
build_flags =
  ${env.build_flags}
  -DNODE_ID=\"xiao-s3-scanner\"

; Target 2: Seeed Studio Wio-SX1262 with XIAO ESP32-S3
; Adds 915 MHz Sub-GHz LoRa alert relay + passive LoRa packet/RSSI logging
[env:xiao_esp32s3_sx1262]
build_flags =
  ${env.build_flags}
  -DNODE_ID=\"xiao-s3-sx1262\"
  -DENABLE_LORA_SX1262=1
lib_deps =
  ${env.lib_deps}
  jgromes/RadioLib@^7.1.0
